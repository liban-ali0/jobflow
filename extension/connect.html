<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Connect Offerbound</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      main { padding: 14px; }
      .address { display: block; margin: 8px 0 12px; padding: 8px 10px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); font-size: 13px; word-break: break-all; }
    </style>
  </head>
  <body>
    <header class="top"><img src="icons/icon-48.png" width="22" height="22" alt="" /><span class="name">Offerbound</span></header>
    <main>
      <section class="card">
        <h3 id="question">Connect this browser to your Offerbound?</h3>
        <code id="origin" class="address">…</code>
        <div class="row">
          <button id="allow" type="button">Connect</button>
          <button id="cancel" class="quiet" type="button">Cancel</button>
        </div>
        <p class="hint" style="margin-top: 10px">Connect only if you just pressed Connect in your own Offerbound (Settings → Sources). The extension then works only with that address.</p>
      </section>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
